symbol: USDSEK
timeframe: M30

data:
  seq_len: 60
  pred_horizon: 5
  train_years: 3
  yfinance_symbol: "USDSEK=X"

features:
  - returns
  - log_returns
  - high_low_range
  - close_open_range
  - rsi_14
  - atr_14
  - bb_position
  - macd_diff
  - ema_fast_slow_ratio
  - volume_zscore
  - hour_sin
  - hour_cos

model:
  type: cfc
  units: 64
  dropout: 0.15

train:
  batch_size: 256
  epochs: 30
  lr: 0.0008
  weight_decay: 5.0e-5
  early_stopping_patience: 6
  val_fraction: 0.15
  test_fraction: 0.15

signal:
  cooldown_bars: 3

# SMC entry permission engine — every "require_*" must pass before any trade
entry:
  # Production: USDSEK M30 lnn_very_strong (sweep winner)
  # Backtest: 282 trades, WR 79.4%, PF 1.42, +$594, MaxDD -1.9%
  require_session_filter: false
  require_htf_bias: false
  require_sweep: false
  require_pullback: false
  require_bos_or_choch: false
  min_lnn_probability: 0.65        # high-confidence LNN signal
  sweep_recent_window: 10
  pullback_window: 4
  invert_direction: false

risk:
  lot_size: 0.01
  leverage: 400
  max_concurrent_positions: 2
  max_daily_loss_pct: 2.0
  sl_atr_multiplier: 1.5
  tp_atr_min_multiplier: 0.6        # tight TP for high win rate
  tp_atr_max_multiplier: 1.5        # capped — small wins, many trades
  spread_pips_estimate: 0.8

backtest:
  start: "2022-01-01"
  end: "2026-01-01"
  commission_per_lot: 7.0
  slippage_pips: 0.3
